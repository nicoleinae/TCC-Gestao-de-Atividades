spring:
  application:
    name: GestaoEventos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tcc}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
app:
  security:
    jwt-secret: ${JWT_SECRET:altere-esta-chave-em-producao-gestao-eventos}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    carteirinha-encryption-secret: ${CARTEIRINHA_ENCRYPTION_SECRET:chave-de-desenvolvimento-da-carteirinha-nao-usar-em-producao}
  certificados:
    diretorio: ${CERTIFICADOS_DIR:./dados/certificados}
